services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "8880:9000"  # S3 API endpoint
      - "8881:9001"  # Web console
    volumes:
      - minio-data:/data

volumes:
  minio-data:
