services:
  apache2:
    image: httpd:2.4
    restart: no
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${PWD}/apache2/etc/conf:/usr/local/apache2/conf
      - ${HOME}/Sites:/var/www/html
  fpm81:
    build: ${PWD}/php/8.1-fpm/
    restart: no
    volumes:
      - ${PWD}/php/8.1-fpm/etc/php-fpm.ini:/usr/local/etc/php/conf.d/zz-magento.ini
      - ${PWD}/php/8.1-fpm/etc/php-xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug-settings.ini
      - ${PWD}/php/8.1-fpm/etc/php-pcov.ini:/usr/local/etc/php/conf.d/zz-pcov-settings.ini
      - ${PWD}/php/8.1-fpm/etc/mail.ini:/usr/local/etc/php/conf.d/zz-mail.ini
      - ${PWD}/php/8.1-fpm/etc/php-fpm.conf:/usr/local/etc/php-fpm.conf
      - ${PWD}/php/8.1-fpm/etc/php-gnupg.ini:/usr/local/etc/php/conf.d/gnupg.ini
      - ${PWD}/utils/m2install.sh:/usr/local/bin/m2install.sh
      - ${PWD}/utils/.m2install.conf:/var/www/.m2install.conf
      - ${PWD}/utils/.composer:/var/www/.composer
      - ${PWD}/utils/.cache/composer:/var/www/.cache/composer
      - ${HOME}/Sites:/var/www/html
    environment:
      MAGENTO_RUN_MODE: developer
    extra_hosts:
      - "host.docker.internal:host-gateway"
  fpm82:
    build: ${PWD}/php/8.2-fpm/
    restart: no
    volumes:
      - ${PWD}/php/8.2-fpm/etc/php-fpm.ini:/usr/local/etc/php/conf.d/zz-magento.ini
      - ${PWD}/php/8.2-fpm/etc/php-xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug-settings.ini
      - ${PWD}/php/8.2-fpm/etc/php-pcov.ini:/usr/local/etc/php/conf.d/zz-pcov-settings.ini
      - ${PWD}/php/8.2-fpm/etc/mail.ini:/usr/local/etc/php/conf.d/zz-mail.ini
      - ${PWD}/php/8.2-fpm/etc/php-fpm.conf:/usr/local/etc/php-fpm.conf
      - ${PWD}/php/8.2-fpm/etc/php-gnupg.ini:/usr/local/etc/php/conf.d/gnupg.ini
      - ${PWD}/utils/m2install.sh:/usr/local/bin/m2install.sh
      - ${PWD}/utils/.m2install.conf:/var/www/.m2install.conf
      - ${PWD}/utils/.composer:/var/www/.composer
      - ${PWD}/utils/.cache/composer:/var/www/.cache/composer
      - ${HOME}/Sites:/var/www/html
    environment:
      MAGENTO_RUN_MODE: developer
    extra_hosts:
      - "host.docker.internal:host-gateway"
  fpm83:
    build: ${PWD}/php/8.3-fpm/
    restart: no
    volumes:
      - ${PWD}/php/8.3-fpm/etc/php-fpm.ini:/usr/local/etc/php/conf.d/zz-magento.ini
      - ${PWD}/php/8.3-fpm/etc/php-xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug-settings.ini
      - ${PWD}/php/8.3-fpm/etc/php-pcov.ini:/usr/local/etc/php/conf.d/zz-pcov-settings.ini
      - ${PWD}/php/8.3-fpm/etc/mail.ini:/usr/local/etc/php/conf.d/zz-mail.ini
      - ${PWD}/php/8.3-fpm/etc/php-fpm.conf:/usr/local/etc/php-fpm.conf
      - ${PWD}/php/8.3-fpm/etc/php-gnupg.ini:/usr/local/etc/php/conf.d/gnupg.ini
      - ${PWD}/utils/m2install.sh:/usr/local/bin/m2install.sh
      - ${PWD}/utils/.m2install.conf:/var/www/.m2install.conf
      - ${PWD}/utils/.composer:/var/www/.composer
      - ${PWD}/utils/.cache/composer:/var/www/.cache/composer
      - ${HOME}/Sites:/var/www/html
    environment:
      MAGENTO_RUN_MODE: developer
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mariadb:
    image: mariadb:10.6.12
    restart: no
    ports:
      - "3306:3306"
    volumes:
      - ${PWD}/mariadb/var/lib/mysql:/var/lib/mysql
      - ${PWD}/mariadb/etc/mysql:/etc/mysql
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
  opensearch:
    build: ${PWD}/opensearch
    restart: no
    environment:
      discovery.type: single-node
    # ports:
    #   - "9200:9200"
  elasticsearch:
    build: ${PWD}/elasticsearch/7.11
    restart: no
    volumes:
    - data01:/usr/share/elasticsearch/data
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    # ports:
    #   - "9200:9200"
volumes:
  data01:
    driver: local