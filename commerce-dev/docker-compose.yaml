services:
  # Elasticsearch 7.11.2
  elasticsearch:
    build: ./elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    restart: always
    ports:
      - "9203:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - search-network

  # OpenSearch 1.2.4
  opensearch_124:
    build: ./opensearch/1.2.4
    restart: always
    environment:
      discovery.type: single-node
    ports:
      - "9202:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-124-data:/usr/share/opensearch/data
    networks:
      - search-network

  # OpenSearch 2.12.0
  opensearch_2120:
    image: opensearchproject/opensearch:2.12.0
    restart: always
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-2120-data:/usr/share/opensearch/data
      - ./opensearch/2.12.0/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
    ports:
      - "9201:9200"
      - "9601:9600"
    networks:
      - search-network

  # Elasticsearch Dashboard (Kibana 7.11.2)
  elasticsearch-dashboard:
    image: docker.elastic.co/kibana/kibana:7.11.2
    platform: linux/amd64
    restart: always
    ports:
      - "5602:5601"
    environment:
      ELASTICSEARCH_HOSTS: 'http://elasticsearch:9200'
    volumes:
      - elasticsearch-dashboard-data:/usr/share/kibana/data
    depends_on:
      - elasticsearch
    networks:
      - search-network

  # OpenSearch Dashboard 1.2.4
  opensearch-dashboard-124:
    image: opensearchproject/opensearch-dashboards:1
    restart: always
    ports:
      - "5603:5601"
    environment:
      OPENSEARCH_HOSTS: 'http://opensearch_124:9200'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    volumes:
      - opensearch-dashboard-124-data:/usr/share/opensearch-dashboards/data
    depends_on:
      - opensearch_124
    networks:
      - search-network

  # OpenSearch Dashboard 2.12.0
  opensearch-dashboard-2120:
    image: opensearchproject/opensearch-dashboards:2
    restart: always
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: 'http://opensearch_2120:9200'
    volumes:
      - opensearch-dashboard-2120-data:/usr/share/opensearch-dashboards/data
    depends_on:
      - opensearch_2120
    networks:
      - search-network

networks:
  search-network:
    driver: bridge

volumes:
  elasticsearch-data:
  opensearch-124-data:
  opensearch-2120-data:
  elasticsearch-dashboard-data:
  opensearch-dashboard-124-data:
  opensearch-dashboard-2120-data:
