services:
  # Elasticsearch 7.11.2
  elasticsearch:
    build: ./elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    restart: unless-stopped
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - search-network

