  rabbitmq:
    hostname: 'rabbitmq'
    image: rabbitmq:3.13.7-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq3_data:/var/lib/rabbitmq

  rabbitmq41:
    hostname: 'rabbitmq'
    image: rabbitmq:4.1.4-management-alpine
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq4_data:/var/lib/rabbitmq
  
  valkey:
    image: valkey/valkey:8.0.1
    container_name: valkey-8.0.1
    ports:
      - "6370:6379"
    volumes:
      - ./valkey/data:/data
    command: >
      valkey-server
    restart: unless-stopped
    
networks:
  search-network:
    driver: bridge

volumes:
  elasticsearch-data:
  opensearch-124-data:
  opensearch-2120-data:
  elasticsearch-dashboard-data:
  opensearch-dashboard-124-data:
  opensearch-dashboard-2120-data:
  mariadb-data:
  mariadb102-data:
  mariadb114-data:
  # mysql80-data:
  rabbitmq3_data:
  rabbitmq4_data:
